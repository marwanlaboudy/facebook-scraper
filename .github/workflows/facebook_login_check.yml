name: Facebook Marketplace Scraper
on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-marketplace-scraper]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip FB profile
        run: |
          unzip fb_profile.zip
          echo "Profile size:"
          du -sh fb_profile/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip xvfb fonts-freefont-ttf
          pip install playwright gspread oauth2client
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          xvfb-run -a python3 scraper.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            marketplace_results.json
            marketplace_hrefs.json
            after_continue.png
            marketplace_loaded.png
            not_logged_in.png
            *.png
