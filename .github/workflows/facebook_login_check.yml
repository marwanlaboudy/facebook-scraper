name: Facebook Login Checker
on:
  workflow_dispatch:
  repository_dispatch:
    types: [check-facebook-login]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load Facebook session
        env:
          FACEBOOK_SESSION: ${{ secrets.FACEBOOK_SESSION }}
        run: |
          printf '%s' "$FACEBOOK_SESSION" > facebook_session.json
          echo "File size:"
          wc -c facebook_session.json
          python3 -c "import json; json.load(open('facebook_session.json')); print('✅ JSON valid')" || echo "❌ JSON invalid"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip xvfb fonts-freefont-ttf
          pip install playwright
          playwright install --with-deps chromium

      - name: Run login check
        run: |
          xvfb-run -a python3 scraper.py

      - name: ✅ Login success message
        if: success()
        run: echo "🎉 Facebook session is VALID and logged in!"

      - name: ❌ Login failed message
        if: failure()
        run: echo "💀 Facebook session is EXPIRED or INVALID!"

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshot
          path: login_check.png
