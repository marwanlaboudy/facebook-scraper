name: Facebook Marketplace Scraper
on:
  workflow_dispatch:


jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          pip install playwright gspread oauth2client

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get install -y xvfb

      - name: Write Google credentials
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          echo "$GOOGLE_CREDS" > google_creds.json

      - name: Write Facebook session
        env:
          FB_SESSION: ${{ secrets.FB_SESSION }}
        run: |
          echo "$FB_SESSION" > facebook_session.json

      - name: Run scrapers
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          python sendmessages.py
          python main.py
